        const AlertCircle = (props) => <IconBase {...props} d={<><circle cx="12" cy="12" r="10"/><line x1="12" x2="12" y1="8" y2="12"/><line x1="12" x2="12.01" y1="16" y2="16"/></>} />;
        const Wifi = (props) => <IconBase {...props} d={<><path d="M5 12.55a11 11 0 0 1 14.08 0"/><path d="M1.42 9a16 16 0 0 1 21.16 0"/><path d="M8.53 16.11a6 6 0 0 1 6.95 0"/><line x1="12" x2="12.01" y1="20" y2="20"/></>} />;

        const App = () => {
          const [inputText, setInputText] = useState('');
          const [outputText, setOutputText] = useState('');
          const [direction, setDirection] = useState('human-na');
          const [interfaceLang, setInterfaceLang] = useState('es');
          const [copied, setCopied] = useState(false);
          const [animateBg, setAnimateBg] = useState(0);
          const [missingWords, setMissingWords] = useState([]);
          const [isTranslating, setIsTranslating] = useState(false);
          
          // Mouse tracking para paralaje
          const [mousePos, setMousePos] = useState({ x: 0, y: 0 });

          // ASSETS
          const QR_FILENAME = "qrcode.jpg";

          useEffect(() => {
            const interval = setInterval(() => {
              setAnimateBg(prev => (prev + 1) % 100);
            }, 50);
            return () => clearInterval(interval);
          }, []);

          const handleMouseMove = (e) => {
            const x = (e.clientX / window.innerWidth - 0.5) * 20; 
            const y = (e.clientY / window.innerHeight - 0.5) * 20;
            setMousePos({ x, y });
          };

          // --- DICCIONARIOS ---
          const dictionaryEs = {
            "hola": "kaltxì", "adios": "kìyevame", "adiós": "kìyevame", "gracias": "irayo", "por favor": "rutxe",
            "si": "srane", "sí": "srane", "no": "kehe", "bien": "sìltsan", "mal": "kawng",
            "quizás": "kxawm", "tal vez": "kxawm", "listo": "tìsraw", "espera": "pey",
            "yo": "oe", "tú": "nga", "tu": "nga", "el": "po", "ella": "po", "él": "po",
            "nosotros": "ayoeng", "ellos": "ayfo", "ustedes": "aynga", "todos": "fìtxan",
            "uno": "'aw", "dos": "mune", "tres": "pxey", "cuatro": "tsìng",

            "respirar": "fngap", "amar": "yawn", "pelear": "tsam", "ayudar": "srung", "hacer": "si",
            "ser": "lu", "estar": "lu",
            "grande": "tsawl", "pequeño": "hì'i", "fuerte": "txur", "débil": "mewia", "rápido": "win",
            "lento": "pizayu", "bueno": "sìltsan", "malo": "kawng", "hermoso": "lor", "feo": "kewong",
            "feliz": "nitram", "triste": "le'aw", "asustado": "txopu", "enojado": "yì", "nuevo": "mip", "viejo": "koak",
            "espíritu": "tìyawn", "alma": "vrrtep", "vida": "tìrey", "muerte": "sìterkup", "sueño": "nrra",
            "miedo": "txopu", "verdad": "tìyawr", "mentira": "tìslew", "camino": "fya'o",
            "te veo": "oel ngati kameie", "te amo": "nga yawne lu oer", "que eywa te acompañe": "eywa ngahu",
            "soy un estudiante": "oe lu numeyu", "buen viaje": "sìltsan fya'o", "no tengo miedo": "oeru ke lu txopu",

            "silencio": "mawey", "calma": "mawey"
          };

          const dictionaryEn = {
            "hello": "kaltxì", "goodbye": "kìyevame", "bye": "kìyevame", "thanks": "irayo", "thank you": "irayo",
            "please": "rutxe", "yes": "srane", "no": "kehe", "good": "sìltsan", "bad": "kawng",
            "maybe": "kxawm", "ready": "tìsraw", "wait": "pey",
            "i": "oe", "you": "nga", "he": "po", "she": "po", "we": "ayoeng", "they": "ayfo", "all": "fìtxan",
            "one": "'aw", "two": "mune", "three": "pxey", "four": "tsìng",
            "five": "mrr", "six": "pukap", "seven": "kinä", "eight": "vol",
            "blue": "ean", "green": "ta'len", "red": "tun", "orange": "tun",
            "yellow": "rim", "white": "teyr", "black": "layon", "dark": "vawm", "bright": "teya",
            "tree": "utral", "forest": "na'rìng", "water": "pay", "fire": "txep",
            "sky": "taw", "earth": "atxkxe", "ground": "kllte", "rock": "tjei", "stone": "tjei",
            "river": "tsawke", "mountain": "ram", "rain": "tompa", "wind": "hufwe", "cloud": "awpa",

            "animal": "ioang", "horse": "pa'li", "viperwolf": "nantang", "hammerhead": "angtsìk",

            "leader": "eyktan", "student": "numeyu", "teacher": "karyu", "mother": "sa'nok", "father": "sempul",
            "brother": "tsmukan", "sister": "tsmuke", "son": "'itan", "daughter": "'ite", "child": "eveng",
            "friend": "'eylan", "enemy": "kxmrr", "man": "tutan", "woman": "tuté",
            "body": "tokx", "head": "re'o", "eye": "nari", "eyes": "nari", "ear": "mikyun",
            "nose": "ontu", "mouth": "tsyokx", "hand": "zong", "leg": "kin", "heart": "txe'lan",
            "blood": "reym", "hair": "hì'ang", "tail": "txo", "braid": "tswin", "bond": "tsaheylu",
            "see": "tse'a", "look": "nìn", "listen": "stawm", "hear": "starun", "go": "kärä",
            "walk": "tìran", "run": "tul", "fly": "tswin", "come": "zä", "eat": "yom",
            "drink": "yur", "sleep": "hahaw", "speak": "pìlltxe", "say": "plltxe", "hunt": "taron",
            "learn": "nume", "teach": "kar", "die": "terkup", "kill": "tspang", "live": "rey",
            "breathe": "fngap", "love": "yawn", "fight": "tsam", "help": "srung", "do": "si",
            "be": "lu", "am": "lu", "is": "lu", "are": "lu",
            "big": "tsawl", "small": "hì'i", "strong": "txur", "weak": "mewia", "fast": "win",
            "slow": "pizayu", "beautiful": "lor", "ugly": "kewong",
            "happy": "nitram", "sad": "le'aw", "scared": "txopu", "angry": "yì", "new": "mip", "old": "koak",
            "spirit": "tìyawn", "soul": "vrrtep", "life": "tìrey", "death": "sìterkup", "dream": "nrra",
            "fear": "txopu", "truth": "tìyawr", "lie": "tìslew", "path": "fya'o", "way": "fya'o",
            "i see you": "oel ngati kameie", "i love you": "nga yawne lu oer", "may eywa be with you": "eywa ngahu",
            "i am a student": "oe lu numeyu", "safe travels": "sìltsan fya'o", "i have no fear": "oeru ke lu txopu",
            "i am sorry": "oeru txoa livu", "sorry": "oeru txoa livu", "what is your name": "fyape fko syaw ngar",
            "my name is": "oeru fko syaw", "i do not understand": "oe ke tslolam", "i understand": "tsole'a",
            "shut up": "mawey", "silence": "mawey", "calm": "mawey"
          };

          const uiText = {
            es: {
              title: "Traductor Na'vi",
              version: "SYS.VER.3.0 // KELUTRAL",
              human: "HUMAN",
              navi: "NA'VI",
              placeholder: (dir) => dir === 'human-na' ? "Escribe aquí (ej: hermano, agua)..." : "Tìpìlltxe fìtseng (ej: tsmukan, pay)...",
              translate: "INICIAR VÍNCULO",
              clear: "BORRAR",
              copied: "COPIADO",
              copy: "COPIAR",
              missingTitle: "DATOS NO ENCONTRADOS",
              missingDesc: "Términos sin equivalente en la base de datos:",
              noteTitle: "Aviso de protocolo",
              noteDesc: "Base de datos limitada a vocabulario esencial. Términos complejos permanecen sin traducir.",
              quick: "ACCESO RÁPIDO"
            },
            en: {
              title: "Na'vi Translator",
              version: "SYS.VER.3.0 // KELUTRAL",
              human: "HUMAN",
              navi: "NA'VI",
              placeholder: (dir) => dir === 'human-na' ? "Type here (e.g., brother, water)..." : "Tìpìlltxe fìtseng (e.g., tsmukan, pay)...",
              translate: "INITIATE BOND",
              clear: "CLEAR",
              copied: "COPIED",
              copy: "COPY",
              missingTitle: "DATA NOT FOUND",
              missingDesc: "Terms without match in database:",
              noteTitle: "Protocol Notice",
              noteDesc: "Database limited to essential vocabulary. Complex terms remain untranslated.",
              quick: "QUICK ACCESS"
            }
          };

          const currentDictionary = interfaceLang === 'es' ? dictionaryEs : dictionaryEn;
          const currentUI = uiText[interfaceLang];

          const reverseDictionary = Object.fromEntries(
            Object.entries(currentDictionary).map(([k, v]) => [v, k])
          );

          const translate = () => {
            setMissingWords([]);
            if (!inputText.trim()) {
              setOutputText('');
              return;
            }
            
            setIsTranslating(true);
            setTimeout(() => setIsTranslating(false), 800);

            let translated = "";
            const lowerInput = inputText.toLowerCase().trim();
            const notFoundList = [];

            if (direction === 'human-na' && currentDictionary[lowerInput]) {
              translated = currentDictionary[lowerInput];
            } else if (direction === 'na-human' && reverseDictionary[lowerInput]) {
              translated = reverseDictionary[lowerInput];
            } else {
              const words = lowerInput.split(/([\s,.!?;:]+)/); 
              translated = words.map(word => {
                const cleanWord = word.trim();
                if (!cleanWord) return word; 
                const isWord = /[a-zA-Záéíóúñ']{2,}/.test(cleanWord);
                let result = cleanWord;
                let found = false;

                if (direction === 'human-na') {
                  if (currentDictionary[cleanWord]) {
                    result = currentDictionary[cleanWord];
                    found = true;
                  }
                } else {
                  if (reverseDictionary[cleanWord]) {
                    result = reverseDictionary[cleanWord];
                    found = true;
                  }
                }
                if (!found && isWord && isNaN(cleanWord)) {
                   if (!notFoundList.includes(cleanWord)) notFoundList.push(cleanWord);
                }
                return result;
              }).join('');
            }
            setOutputText(translated);
            setMissingWords(notFoundList);
          };

          const handleCopy = () => {
            navigator.clipboard.writeText(outputText);
            setCopied(true);
            setTimeout(() => setCopied(false), 2000);
          };

          const handleKeyDown = (e) => {
            if (e.key === 'Enter' && !e.shiftKey) {
              e.preventDefault();
              translate();
            }
          };

          const swapLanguages = () => {
            setDirection(prev => prev === 'human-na' ? 'na-human' : 'human-na');
            setInputText(outputText);
            setOutputText(inputText);
            setMissingWords([]);
          };

            { label: "Hola", text: "Hola" },
            { label: "Te veo", text: "Te veo" },
            { label: "Gracias", text: "Gracias" },
            { label: "Vínculo", text: "Vínculo" }
          ] : [

            { label: "I see you", text: "I see you" },
            { label: "Thanks", text: "Thanks" },
            { label: "Bond", text: "Bond" }
          ];

                <div

                  style={{ transform: `translate(${mousePos.x * 1.5}px, ${mousePos.y * 1.5}px)` }}
                />
                {[...Array(25)].map((_, i) => (
                  <div
                    key={i}
                    className="absolute bg-teal-400 rounded-full opacity-60 shadow-[0_0_10px_rgba(45,212,191,0.8)]"
                    style={{
                      width: Math.random() * 3 + 2 + 'px',
                      height: Math.random() * 3 + 2 + 'px',
                      top: Math.random() * 100 + '%',
                      left: Math.random() * 100 + '%',
                      animation: `pulse ${Math.random() * 4 + 2}s infinite`,
                      transform: `translate(${mousePos.x * (Math.random() * 2 - 4)}px, ${mousePos.y * (Math.random() * 2 - 4)}px)`
                    }}
                  />
                ))}
                {/* Grid Overlay para efecto HUD */}
                <div className="absolute inset-0 bg-[linear-gradient(rgba(6,182,212,0.03)_1px,transparent_1px),linear-gradient(90deg,rgba(6,182,212,0.03)_1px,transparent_1px)] bg-[size:40px_40px] pointer-events-none" />
              </div>

              <div className="relative z-10 container mx-auto px-4 py-8 max-w-4xl flex flex-col min-h-screen">
                
                {/* Header & Lang Switcher */}
                <header className="flex flex-col md:flex-row items-center justify-between mb-8 border-b border-cyan-500/30 pb-4 gap-4 bg-slate-900/40 backdrop-blur-sm p-4 rounded-t-lg border-t border-x border-cyan-500/10">

                    {/* LOGO BLOCK ADAPTED - REPLACED IMG WITH SVG */}
                    <div className="h-16 w-16 rounded-xl overflow-hidden shadow-[0_0_15px_rgba(6,182,212,0.3)] border border-cyan-500/50 bg-slate-900 relative group shrink-0 flex items-center justify-center">

                    <div>

                        KELUTRAL
                      </h1>
                      <p className="text-[10px] text-cyan-600 font-mono tracking-widest uppercase flex items-center gap-2">
                        <span className="w-2 h-2 bg-green-500 rounded-full animate-pulse"></span>
                        {currentUI.title} // SYSTEM ONLINE
                      </p>
                      <p className="text-[10px] text-cyan-700/70 mt-1 font-mono">
                          Created by <a href="https://cdcruzher.github.io/cdcruzher/" target="_blank" rel="noopener noreferrer" className="text-cyan-500 hover:text-cyan-300 transition-colors">@cdcruzher</a>

                  <div className="flex items-center gap-3 self-end sm:self-auto">
                     {/* Language Toggle */}
                     <div className="flex bg-slate-950/80 rounded border border-cyan-800 p-0.5">
                        <button 
                          onClick={() => { setInterfaceLang('es'); setInputText(''); setOutputText(''); setMissingWords([]); }}
                          className={`px-4 py-1 rounded-sm text-xs font-bold font-mono transition-all ${interfaceLang === 'es' ? 'bg-cyan-900/80 text-cyan-100 shadow-[0_0_10px_rgba(8,145,178,0.5)] border border-cyan-500/30' : 'text-cyan-700 hover:text-cyan-400'}`}
                        >
                          ESP
                        </button>
                        <button 
                          onClick={() => { setInterfaceLang('en'); setInputText(''); setOutputText(''); setMissingWords([]); }}
                          className={`px-4 py-1 rounded-sm text-xs font-bold font-mono transition-all ${interfaceLang === 'en' ? 'bg-cyan-900/80 text-cyan-100 shadow-[0_0_10px_rgba(8,145,178,0.5)] border border-cyan-500/30' : 'text-cyan-700 hover:text-cyan-400'}`}
                        >
                          ENG
                        </button>
                     </div>

                    <div className="hidden sm:flex items-center gap-2 text-[10px] text-cyan-600 border border-cyan-900/50 rounded px-3 py-1 bg-slate-950/50 font-mono">
                      <Terminal size={12} />
                      <span>{currentUI.version}</span>
                    </div>
                  </div>
                </header>

                {/* Main Translator Area */}
                <main className="flex-1 flex flex-col gap-6 relative">
                  
                  {/* Controls Header */}
                  <div className="bg-slate-900/80 backdrop-blur-md rounded border border-cyan-500/30 p-1 flex justify-between items-center shadow-lg relative overflow-hidden">
                     {/* Decorative lines */}
                     <div className="absolute top-0 left-0 w-1 h-full bg-cyan-500/50"></div>
                     <div className="absolute top-0 right-0 w-1 h-full bg-cyan-500/50"></div>

                    <div className="flex-1 text-center py-2 font-bold text-cyan-400 tracking-widest flex items-center justify-center gap-3" style={{ fontFamily: "'Orbitron', sans-serif" }}>
                      <Globe size={14} className="text-cyan-600" />
                      {direction === 'human-na' ? currentUI.human : currentUI.navi}
                    </div>
                    
                    <button 
                      onClick={swapLanguages}
                      className="p-2 rounded bg-cyan-950 border border-cyan-700 hover:bg-cyan-900 hover:border-cyan-400 text-cyan-400 transition-all duration-300 group z-10"
                    >
                      <ArrowRightLeft className="w-4 h-4 group-hover:rotate-180 transition-transform duration-500" />
                    </button>
                    
                    <div className="flex-1 text-center py-2 font-bold text-cyan-400 tracking-widest flex items-center justify-center gap-3" style={{ fontFamily: "'Orbitron', sans-serif" }}>
                      <TreeDeciduous size={14} className="text-cyan-600" />
                      {direction === 'human-na' ? currentUI.navi : currentUI.human}
                    </div>
                  </div>

                  {/* Input/Output Container */}
                  <div className="flex-1 flex flex-col md:flex-row gap-4 relative">
                    
                    {/* Tsaheylu Connection Effect (Mobile safe) */}
                    {isTranslating && (
                       <div className="absolute left-1/2 top-1/2 -translate-x-1/2 -translate-y-1/2 z-50 pointer-events-none hidden md:block">
                          <div className="w-[400px] h-[2px] bg-cyan-400 shadow-[0_0_20px_rgba(34,211,238,1)] animate-pulse"></div>
                          <div className="absolute top-1/2 left-1/2 -translate-x-1/2 -translate-y-1/2 w-10 h-10 bg-cyan-400/20 rounded-full blur-xl animate-ping"></div>
                       </div>
                    )}

                    {/* Input Area */}
                    <div className="flex-1 relative group">
                      <div className="absolute -inset-0.5 bg-gradient-to-r from-cyan-500/20 to-blue-600/20 rounded opacity-75 group-hover:opacity-100 transition duration-1000 group-hover:duration-200 blur"></div>
                      <div className="relative w-full h-full bg-slate-900 rounded border border-cyan-500/30 flex flex-col">
                          {/* Decorative corner markers */}
                          <div className="absolute top-0 left-0 w-2 h-2 border-t-2 border-l-2 border-cyan-500"></div>
                          <div className="absolute top-0 right-0 w-2 h-2 border-t-2 border-r-2 border-cyan-500"></div>
                          <div className="absolute bottom-0 left-0 w-2 h-2 border-b-2 border-l-2 border-cyan-500"></div>
                          <div className="absolute bottom-0 right-0 w-2 h-2 border-b-2 border-r-2 border-cyan-500"></div>

                          <textarea
                            value={inputText}
                            onChange={(e) => setInputText(e.target.value)}
                            onKeyDown={handleKeyDown}
                            placeholder={currentUI.placeholder(direction)}
                            className="w-full h-full min-h-[200px] md:min-h-0 bg-transparent border-none p-6 pb-14 text-lg text-cyan-100 placeholder-cyan-800/70 focus:ring-0 resize-none font-mono"
                          />
                          
                          <div className="absolute bottom-3 right-3 flex items-center gap-2">
                            {inputText && (
                              <button 
                                onClick={() => { setInputText(''); setOutputText(''); setMissingWords([]); }}
                                className="px-2 py-1 text-[10px] uppercase tracking-widest text-cyan-700 hover:text-red-400 font-bold transition-colors"
                              >
                                {currentUI.clear}
                              </button>
                            )}
                             <div className="hidden md:flex items-center text-cyan-800 text-[9px] uppercase font-bold border border-cyan-900/30 rounded px-1.5 py-0.5 ml-2">
                               <Keyboard size={10} className="mr-1" /> Enter
                             </div>
                          </div>
                      </div>
                    </div>

                    {/* Output Area */}
                    <div className="flex-1 relative group">
                      <div className={`absolute -inset-0.5 bg-gradient-to-l from-purple-500/20 to-cyan-600/20 rounded opacity-75 transition duration-500 blur ${outputText ? 'opacity-100' : 'opacity-0'}`}></div>
                      <div className="relative w-full h-full min-h-[200px] md:min-h-0 bg-slate-900/90 rounded border border-cyan-500/30 p-6 flex flex-col overflow-hidden">
                         
                         {/* Scanning line effect */}
                         {isTranslating && (
                           <div className="absolute top-0 left-0 w-full h-1 bg-cyan-400/50 shadow-[0_0_15px_rgba(34,211,238,0.8)] animate-[scan_1s_ease-in-out]"></div>
                         )}

                         <div className="flex-1 font-medium font-mono z-10 text-xl tracking-wide leading-relaxed">
                            {outputText ? (
                              <span className="text-cyan-100 drop-shadow-[0_0_8px_rgba(6,182,212,0.3)]">{outputText}</span>
                            ) : (
                              <span className="text-cyan-900/40 italic flex items-center gap-2">
                                <Wifi size={16} className="animate-pulse" /> WAITING FOR INPUT...
                              </span>
                            )}
                         </div>
                         
                         {outputText && (
                           <div className="flex justify-end gap-2 mt-4 pt-4 border-t border-cyan-900/30 z-10">
                             <button 
                               onClick={handleCopy}
                               className="flex items-center gap-2 px-3 py-1.5 rounded bg-cyan-950 hover:bg-cyan-900 border border-cyan-800 text-xs text-cyan-400 font-bold tracking-wider transition-colors uppercase"
                             >
                               {copied ? <span className="text-green-400">{currentUI.copied}</span> : <><Copy size={14} /> {currentUI.copy}</>}
                             </button>
                           </div>
                         )}
                      </div>
                    </div>
                  </div>

                  {/* Action Button */}
                  <button
                    onClick={translate}
                    className="w-full py-5 bg-cyan-900/20 border border-cyan-500/50 hover:bg-cyan-500/10 hover:border-cyan-400 rounded-sm font-bold text-cyan-300 shadow-[0_0_20px_rgba(6,182,212,0.1)] hover:shadow-[0_0_30px_rgba(6,182,212,0.3)] transition-all active:scale-[0.99] flex items-center justify-center gap-4 uppercase tracking-[0.25em] group overflow-hidden relative"
                    style={{ fontFamily: "'Orbitron', sans-serif" }}
                  >
                    <div className="absolute inset-0 w-full h-full bg-gradient-to-r from-transparent via-cyan-400/10 to-transparent -translate-x-full group-hover:animate-[shimmer_1.5s_infinite]"></div>
                    <Sparkles className="w-5 h-5 group-hover:text-white transition-colors" />
                    {currentUI.translate}
                  </button>

                  {/* Missing Words Alert (Tech Style) */}
                  {missingWords.length > 0 && (
                    <div className="bg-orange-950/30 border-l-4 border-orange-500 p-4 flex gap-4 animate-in fade-in slide-in-from-top-2 duration-300">
                       <AlertCircle className="text-orange-500 shrink-0 mt-0.5" size={20} />
                       <div>
                         <h4 className="text-orange-400 text-sm font-bold mb-1 tracking-wider uppercase font-mono">{currentUI.missingTitle}</h4>
                         <p className="text-orange-200/60 text-xs mb-2 font-mono">{currentUI.missingDesc}</p>
                         <div className="flex flex-wrap gap-2">
                           {missingWords.map((word, idx) => (
                             <span key={idx} className="bg-orange-900/40 text-orange-300 px-2 py-0.5 rounded-sm text-xs font-mono border border-orange-700/30 uppercase">
                               {word}
                             </span>
                           ))}
                         </div>
                       </div>
                    </div>
                  )}

                  {/* Quick Phrases */}
                  <div className="mt-2 border-t border-cyan-900/30 pt-4">
                    <h3 className="text-xs uppercase tracking-[0.2em] text-cyan-700 mb-4 flex items-center gap-2 font-bold" style={{ fontFamily: "'Orbitron', sans-serif" }}>
                      <Info size={14} /> {currentUI.quick}
                    </h3>
                    <div className="grid grid-cols-2 md:grid-cols-4 gap-3">
                      {quickPhrases.map((phrase, idx) => (
                        <button
                          key={idx}
                          onClick={() => {
                            setDirection('human-na');
                            setInputText(phrase.text);
                            setTimeout(() => {
                               const lower = phrase.text.toLowerCase();
                               const dict = currentDictionary;
                               setOutputText(dict[lower] || ""); 
                            }, 50);
                          }}
                          className="p-3 bg-slate-900/60 border border-cyan-800/30 rounded hover:bg-cyan-900/30 hover:border-cyan-500/50 transition-all text-left group relative overflow-hidden"
                        >
                          <div className="absolute right-0 bottom-0 opacity-10 group-hover:opacity-30 transition-opacity">
                             <TreeDeciduous size={40} className="text-cyan-500 transform translate-x-1 translate-y-1" />
                          </div>
                          <div className="text-cyan-300 text-xs font-bold tracking-wider group-hover:text-cyan-100 uppercase z-10 relative">{phrase.label}</div>
                          <div className="w-8 h-0.5 bg-cyan-800 group-hover:bg-cyan-400 mt-2 transition-colors"></div>
                        </button>
                      ))}
                    </div>
                  </div>

                  {/* Nota gramatical */}
                  <div className="mt-2 p-3 border-t border-cyan-900/30 text-[10px] text-cyan-800 font-mono text-center uppercase tracking-widest opacity-60">
                    {currentUI.noteTitle} // {currentUI.noteDesc}
                  </div>

                  {/* FOOTER / DONATE SECTION (NEW) */}
                  <div className="mt-12 py-8 border-t border-cyan-900/30 flex flex-col items-center text-center">
                    <div className="mb-6 p-1 rounded-2xl bg-gradient-to-tr from-cyan-500 to-blue-600 shadow-[0_0_30px_rgba(6,182,212,0.4)] opacity-90">
                        <a 
                            href="https://www.paypal.com/donate/?business=6EN68NHUTM2KQ&no_recurring=0&item_name=Thanks+for+your+support+Amigo%21&currency_code=USD" 
                            target="_blank" 
                            rel="noopener noreferrer" 
                            className="block w-36 h-36 bg-slate-950 p-3 rounded-xl hover:opacity-95 transition-all cursor-pointer group relative" 
                            title="Scan or Click to Donate"
                        >
                            <img 
                                src={QR_FILENAME} 
                                alt="Donate QR Code" 
                                className="w-full h-full object-contain opacity-90"
                                onError={(e) => {
                                    e.target.src = "https://api.qrserver.com/v1/create-qr-code/?size=150x150&data=https%3A%2F%2Fwww.paypal.com%2Fdonate%2F%3Fbusiness%3D6EN68NHUTM2KQ%26no_recurring%3D0%26item_name%3DThanks%2Bfor%2Byour%2Bsupport%2BAmigo%21%26currency_code%3DUSD";
                                }}
                            />
                            {/* Overlay text */}
                            <div className="absolute inset-0 bg-cyan-900/80 opacity-0 group-hover:opacity-100 transition-opacity rounded-xl flex items-center justify-center backdrop-blur-sm">
                                <span className="bg-cyan-500 text-slate-950 text-[10px] font-bold px-2 py-1 rounded tracking-widest uppercase">Donate</span>
                            </div>
                        </a>
                    </div>
                    <h4 className="text-sm font-bold text-cyan-300 tracking-widest uppercase" style={{ fontFamily: "'Orbitron', sans-serif" }}>Enjoying the Translator?</h4>
                    <p className="text-xs text-cyan-600/70 mt-1 mb-4 font-mono">Support the creation of more tools.</p>
                    
                    <p className="text-[10px] text-cyan-800 mt-4 font-mono">
                        Created by Carlos David <a href="https://cdcruzher.github.io/cdcruzher/" target="_blank" rel="noopener noreferrer" className="text-cyan-500 hover:text-cyan-300 transition-colors">@cdcruzher</a>
                    </p>
                  </div>

                </main>
              </div>
            </div>
          );
        };

        const root = ReactDOM.createRoot(document.getElementById('root'));
        root.render(<App />);
    </script>
</body>
</html>
